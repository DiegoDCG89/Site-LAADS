<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>{{ title }}</title>
  <link rel="icon" href="{{ url_for('static', filename='favicon.svg') }}" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Inter:wght@400;500;600;700;800&family=Orbitron:wght@500;700;900&display=swap">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/site.css', v=asset_v) }}">
</head>
<body class="min-h-screen bg-background text-foreground">
  <div class="circuit-grid pointer-events-none fixed inset-0" aria-hidden="true"></div>
  <main class="relative flex min-h-screen items-center justify-center px-6">
    <div class="hud-panel relative w-full max-w-md p-10 text-center">
      <span class="hud-corner hud-tl"></span><span class="hud-corner hud-tr"></span>
      <span class="hud-corner hud-bl"></span><span class="hud-corner hud-br"></span>
      <p class="eyebrow text-xs">erro.{{ code }}</p>
      <h1 class="font-display mt-4 text-6xl font-bold text-gradient">{{ code }}</h1>
      <h2 class="mt-4 text-xl font-semibold">{{ title }}</h2>
      <p class="mt-2 text-sm text-muted-foreground">{{ text }}</p>
      <a href="{{ url_for('public.index') }}" class="btn-neon mt-8 justify-center">Voltar ao início</a>
    </div>
  </main>
</body>
</html>
